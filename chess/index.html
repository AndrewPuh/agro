<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Simple Chess</h1>
<div id="controls">
  <label>Light color: <input type="color" id="lightColor" value="#f0d9b5"></label>
  <label>Dark color: <input type="color" id="darkColor" value="#b58863"></label>
  <button id="applyColors">Apply</button>
</div>
<div id="board"></div>
<button id="shareButton">Share link</button>
<input id="shareLink" type="text" readonly size="60">
<script src="script.js"></script>
</body>
</html>
